
name: Build TV Quick Remote

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: gradle :mobile:assembleDebug :tv:assembleDebug --no-daemon

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: TVQuickRemote-Mobile-APK
          path: mobile/build/outputs/apk/debug/mobile-debug.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: TVQuickRemote-TV-Bridge-APK
          path: tv/build/outputs/apk/debug/tv-debug.apk
