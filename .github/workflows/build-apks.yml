
name: Build TV Quick Remote

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          "$MANAGER" --version

          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            yes | "$MANAGER" --licenses >/dev/null || true
            "$MANAGER" --install \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

      - name: Build APK
        run: |
          gradle :mobile:assembleDebug :tv:assembleDebug --no-daemon --stacktrace

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: TVQuickRemote-Mobile-APK
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: TVQuickRemote-TV-Bridge-APK
          path: tv/build/outputs/apk/debug/tv-debug.apk
          if-no-files-found: error
