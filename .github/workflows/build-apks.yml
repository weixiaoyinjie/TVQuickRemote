
name: Build TV Quick Remote

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source ZIP
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q TVQuickRemote_v1_Source.zip -d project
          test -f project/settings.gradle
          test -f project/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            yes | "$MANAGER" --licenses >/dev/null || true
            "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Build APK
        working-directory: project
        run: gradle :mobile:assembleDebug :tv:assembleDebug --no-daemon --stacktrace

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: TVQuickRemote-Mobile-APK
          path: project/mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: TVQuickRemote-TV-Bridge-APK
          path: project/tv/build/outputs/apk/debug/tv-debug.apk
          if-no-files-found: error
